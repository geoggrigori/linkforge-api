services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Override these in production. SECRET_KEY must be a strong random value.
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:////data/linkforge.db
      BASE_URL: http://localhost:8000
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - linkforge-data:/data

volumes:
  linkforge-data:
